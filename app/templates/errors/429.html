{% extends "base.html" %}

{% block title %}429 - Too Many Requests{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1">429</h1>
            <h2 class="mb-4">Too Many Requests</h2>
            <p class="lead">You've made too many requests in a short period of time.</p>
            <p>Please wait a moment and try again.</p>
            <div class="mt-4">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go to Home</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
