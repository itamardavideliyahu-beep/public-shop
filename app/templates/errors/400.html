{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1">400</h1>
            <h2 class="mb-4">Bad Request</h2>
            <p class="lead">The request could not be understood by the server.</p>
            <p>Please check your input and try again.</p>
            <div class="mt-4">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go to Home</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
